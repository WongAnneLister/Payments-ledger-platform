name: PR20 isolated experiments

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Full frozen performance budget or explicitly smaller smoke'
        required: true
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STRIPE_CONTRACT_TESTS: 'false'
      PR06_STRIPE_CONTRACT: 'false'
      PAYOUT_REAL_READ_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
          cache: maven
      - name: Check PR20 evidence gates
        run: python3 -m unittest discover -s scripts/tests -p 'test_pr20_runner.py'
      - name: Run local verification, recovery, demo and performance
        env:
          PR20_PROFILE: ${{ inputs.profile }}
        run: python3 scripts/ci/run_pr20.py --phase all --profile "$PR20_PROFILE"
      - name: Retain all outcomes including FAIL and BLOCKED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr20-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            target/pr20/**
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
