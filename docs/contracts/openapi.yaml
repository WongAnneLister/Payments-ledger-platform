        updatedAt: "2026-09-10T11:30:02Z"

    PaymentSucceededPendingEvidence:
      summary: 支付已确认成功，但 BT 尚未取得（financialStatus=PENDING_EVIDENCE）
      value:
        id: "pay_01HZX9K2M4N6P8Q0R2S4T6V8W0"
        businessOrderId: "bor_01HZX9K2M4N6P8Q0R2S4T6V8W1"
        orderKey: "order-2026-0001"
        amountMinor: 10000
        currency: "USD"
        paymentStatus: "SUCCEEDED"
        providerStatus: "succeeded"
        resolutionStatus: "KNOWN"
        financialStatus: "PENDING_EVIDENCE"
        capturedAmountMinor: 10000
        refundedAmountMinor: 0
        reservedAmountMinor: 0
        refundableAmountMinor: 10000
        refundControlState: "NORMAL"
        nextAction: { type: "NONE" }
        provider:
          checkoutSessionId: "cs_test_a1xxxxxxxxxxxxxxxxxxxxxxxx"
          paymentIntentId: "pi_3Pxxxxxxxxxxxxxxxxxxxxxx"
          latestChargeId: "ch_3Pxxxxxxxxxxxxxxxxxxxxxx"
          attempts:
            - attemptId: "att_01HZX9K2M4N6P8Q0R2S4T6V8W2"
              providerObjectType: "CHARGE"
              providerObjectId: "ch_3PxxxxxxxxxxxxxxxxxxxxxA"
              providerStatus: "failed"
              failureCode: "card_declined"
              captured: false
              amountMinor: 10000
              balanceTransactionId: null
              createdAt: "2026-09-10T11:31:00Z"
            - attemptId: "att_01HZX9K2M4N6P8Q0R2S4T6V8W3"
              providerObjectType: "CHARGE"
              providerObjectId: "ch_3Pxxxxxxxxxxxxxxxxxxxxxx"
              providerStatus: "succeeded"
              failureCode: null
              captured: true
              amountMinor: 10000
              balanceTransactionId: null
              createdAt: "2026-09-10T11:32:10Z"
        revenueShares: []
        lastProviderConfirmedAt: "2026-09-10T11:32:12Z"
        createdAt: "2026-09-10T11:30:00Z"
        updatedAt: "2026-09-10T11:32:12Z"

    PaymentUnknown:
      summary: 结果确定性未知，保留最后已知 provider 事实并由恢复流程收敛
      value:
        id: "pay_01HZX9K2M4N6P8Q0R2S4T6V8W4"
        businessOrderId: "bor_01HZX9K2M4N6P8Q0R2S4T6V8W5"
        orderKey: "order-2026-0002"
        amountMinor: 10000
        currency: "USD"
        paymentStatus: "PROCESSING"
        providerStatus: "processing"
        resolutionStatus: "UNKNOWN"
        financialStatus: "NOT_APPLICABLE"
        capturedAmountMinor: 0
        refundedAmountMinor: 0
        reservedAmountMinor: 0
        refundableAmountMinor: 0
        refundControlState: "NORMAL"
        nextAction: { type: "WAIT_FOR_CONFIRMATION" }
        provider:
          checkoutSessionId: "cs_test_b2xxxxxxxxxxxxxxxxxxxxxxxx"
          paymentIntentId: "pi_3Pyyyyyyyyyyyyyyyyyyyyyy"
          latestChargeId: null
          attempts: []
        revenueShares: []
        lastProviderConfirmedAt: "2026-09-10T11:40:00Z"
        createdAt: "2026-09-10T11:39:00Z"
        updatedAt: "2026-09-10T11:41:00Z"

    PaymentCanceled:
      summary: 会话在 OPEN 状态下被过期，且无任何已受理的资金事实
      value:
        id: "pay_01HZX9K2M4N6P8Q0R2S4T6V8W6"
        businessOrderId: "bor_01HZX9K2M4N6P8Q0R2S4T6V8W7"
        orderKey: "order-2026-0003"
        amountMinor: 10000
        currency: "USD"
        paymentStatus: "CANCELED"
        providerStatus: "expired"
        resolutionStatus: "KNOWN"
        financialStatus: "NOT_APPLICABLE"
        capturedAmountMinor: 0
        refundedAmountMinor: 0
        reservedAmountMinor: 0
        refundableAmountMinor: 0
        refundControlState: "NORMAL"
        nextAction: { type: "NONE" }
        provider:
          checkoutSessionId: "cs_test_c3xxxxxxxxxxxxxxxxxxxxxxxx"
          paymentIntentId: null
          latestChargeId: null
          attempts: []
        revenueShares: []
        lastProviderConfirmedAt: "2026-09-10T12:31:00Z"
        createdAt: "2026-09-10T11:50:00Z"
        updatedAt: "2026-09-10T12:31:00Z"

    RefundReserved:
      summary: 已原子预占 4000（H=4000），尚未调用 Stripe
      value:
        id: "ref_01HZX9K2M4N6P8Q0R2S4T6V8X0"
        paymentId: "pay_01HZX9K2M4N6P8Q0R2S4T6V8W0"
        amountMinor: 4000
        currency: "USD"
        refundStatus: "RESERVED"
        providerStatus: null
        resolutionStatus: "KNOWN"
        financialStatus: "NOT_APPLICABLE"
        controlState: "NORMAL"
        reservation:
          capturedMinor: 10000
          refundedMinor: 0
          reservedMinor: 4000
          availableMinor: 6000
        providerRefundId: null
        evidence:
          refundBalanceTransactionId: null
          failureBalanceTransactionId: null
          actualFeeRefundMinor: 0
          postedJournalIds: []
        reason: "REQUESTED_BY_CUSTOMER"
        lastProviderConfirmedAt: null
        createdAt: "2026-09-10T13:00:00Z"
